name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "cursor/**"

jobs:
  validate-scaffold:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required docs and templates
        run: bash scripts/validate_docs.sh

      - name: Ensure MITRE ATT&CK risk register exists
        run: test -f docs/security/mitre-attack-risk-register-template.md
